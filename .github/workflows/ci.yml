name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Validate release metadata
        run: poetry run python scripts/check_release.py

      - name: Lint
        run: poetry run ruff check .

      - name: Format check
        run: poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy src

      - name: Test with coverage
        run: >-
          poetry run pytest
          --cov=feedback_intelligence_agent
          --cov-report=term-missing
          --cov-fail-under=63

      - name: Run deterministic demo
        run: poetry run python scripts/run_demo.py

      - name: Build package
        run: poetry build

  mlflow-integration:
    name: MLflow tracking (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      FEEDBACK_AGENT_MLFLOW_TEST: "1"
      MLFLOW_ENABLE_TELEMETRY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install tracking extra
        run: poetry install --with dev --extras mlflow

      - name: Test local tracking backends
        run: poetry run pytest tests/test_mlflow_integration.py

  qdrant-integration:
    name: Qdrant source updates (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - 6333:6333
    env:
      FEEDBACK_AGENT_QDRANT_TEST: "1"
      FEEDBACK_AGENT_QDRANT_URL: http://localhost:6333
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install Qdrant extra
        run: poetry install --with dev --extras qdrant

      - name: Wait for Qdrant readiness
        run: curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://localhost:6333/readyz

      - name: Test Qdrant persistence and replacements
        run: >-
          poetry run pytest tests/test_qdrant_store.py tests/test_qdrant_integration.py
          tests/test_qdrant_record_ingestion.py

  windows-persistence:
    name: Windows index persistence
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.2.1

      - name: Install dependencies
        run: poetry install --with dev

      - name: Test atomic saves and concurrent updates
        run: >-
          poetry run pytest tests/test_index_persistence.py
          tests/test_index_updates.py tests/test_embeddings_and_store.py
          tests/test_record_ingestion.py tests/test_agent_snapshots.py
          tests/test_qdrant_coordination.py

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      # Full history: the drift check regenerates as of the revision the
      # committed documentation records, which is an ancestor of HEAD and is
      # therefore absent from the default shallow clone.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      # The documentation toolchain reads pyproject.toml with tomllib, which
      # needs Python 3.11+; the package itself still supports 3.10.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Type check documentation toolchain
        run: poetry run mypy --python-version 3.11 docs/tools

      - name: Test documentation toolchain
        run: poetry run pytest tests/test_docs_tools.py

      # Regenerate as of the revision the committed documentation records,
      # not HEAD. Documentation committed with a change necessarily records
      # its parent -- a commit cannot contain its own hash -- so regenerating
      # at HEAD would always differ. Pinning the revision makes any remaining
      # difference genuine content drift.
      - name: Regenerate and validate documentation
        run: |
          revision=$(python -c "import json;print(json.load(open('docs/metadata/documentation-manifest.json'))['revision'])")
          echo "Regenerating as of the documented revision ${revision}"
          make docs REVISION="${revision}"

      - name: Fail if regeneration changed tracked files
        run: |
          if ! git diff --quiet -- docs/; then
            echo "Generated documentation is out of date. Run 'make docs' and commit the result."
            git diff --stat -- docs/
            exit 1
          fi
