<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Intelligence Agent — Demo</title>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Customer Feedback Intelligence</h1>
        <p class="app__subtitle">
          Ask a question about the indexed customer feedback. Answers are grounded
          in retrieved evidence with citations.
        </p>
      </header>

      <form id="query-form" class="query">
        <label class="query__label" for="question">Question</label>
        <textarea
          id="question"
          class="query__input"
          rows="3"
          placeholder="Why are enterprise customers unhappy with onboarding?"
          required
        ></textarea>

        <div class="query__controls">
          <label class="toggle">
            <input type="checkbox" id="stream-toggle" />
            <span>Stream tokens (SSE)</span>
          </label>
          <button type="submit" id="submit-btn" class="query__submit">Ask</button>
        </div>
      </form>

      <section id="status" class="status" hidden></section>

      <section id="dashboard-panel" class="panel dashboard" hidden>
        <h2 class="panel__title">Session dashboard</h2>
        <div id="dashboard-summary" class="dashboard__summary"></div>
        <div class="dashboard__charts">
          <div class="dashboard__chart">
            <h3>Latency</h3>
            <div id="latency-chart" class="bar-chart"></div>
          </div>
          <div class="dashboard__chart">
            <h3>Retrieval scores</h3>
            <div id="score-chart" class="score-chart"></div>
          </div>
          <div class="dashboard__chart">
            <h3>Citation coverage</h3>
            <div id="coverage-chart" class="coverage-chart"></div>
          </div>
        </div>
      </section>

      <section id="answer-panel" class="panel" hidden>
        <div class="panel__header">
          <h2 class="panel__title">Answer</h2>
          <div class="panel__actions">
            <button type="button" id="feedback-useful-btn" class="panel__action" hidden>
              Useful
            </button>
            <button type="button" id="feedback-not-useful-btn" class="panel__action" hidden>
              Needs work
            </button>
            <button type="button" id="save-report-btn" class="panel__action" hidden>
              Save report
            </button>
          </div>
        </div>
        <div id="answer" class="panel__body answer"></div>
        <div id="actions" class="actions"></div>
      </section>

      <section id="reports-panel" class="panel" hidden>
        <div class="panel__header">
          <h2 class="panel__title">Saved reports</h2>
          <button type="button" id="refresh-reports-btn" class="panel__action">
            Refresh
          </button>
        </div>
        <ol id="reports" class="reports"></ol>
      </section>

      <section id="meta-panel" class="panel" hidden>
        <h2 class="panel__title">Metadata</h2>
        <dl id="meta" class="meta"></dl>
      </section>

      <section id="sources-panel" class="panel" hidden>
        <h2 class="panel__title">Retrieved sources</h2>
        <ol id="sources" class="sources"></ol>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
